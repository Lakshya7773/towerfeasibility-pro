name: Release APK

# Manual only — a production-signed APK is a release artifact, not something
# every push should produce. Requires repository secrets:
#   KEYSTORE_BASE64    base64 of the release keystore (.keystore/.jks)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
# Create them with:  base64 -w0 ~/.keystore/towerfeasibility-release.keystore | gh secret set KEYSTORE_BASE64

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Data pack region baked into the app'
        required: true
        default: 'rajasthan'

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK / NDK
        # See ci.yml — setup-android@v3 tries to install the retired "tools"
        # package; use the runner's preinstalled SDK instead.
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          [ -n "$SDKMGR" ] || { echo "::error::sdkmanager not found under $SDK_ROOT"; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "platform-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install JS dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          mkdir -p "$HOME/.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.keystore/release.keystore"
          ls -la "$HOME/.keystore/release.keystore"

      - name: Build release APK
        working-directory: app/android
        env:
          TOWERFEASIBILITY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TOWERFEASIBILITY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TOWERFEASIBILITY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          export TOWERFEASIBILITY_KEYSTORE="$HOME/.keystore/release.keystore"
          # 2 GB heap: the APK path packs ~294 MB of data-pack entries.
          ./gradlew assembleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2048m -Xms256m"

      - name: Build release AAB (Play Store bundle)
        working-directory: app/android
        env:
          TOWERFEASIBILITY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TOWERFEASIBILITY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TOWERFEASIBILITY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export TOWERFEASIBILITY_KEYSTORE="$HOME/.keystore/release.keystore"
          # bundleRelease buffers every entry of the ~294 MB pack in the bundler
          # (AabFlinger). At -Xmx512m this OOMs in
          # FinalizeBundleTask$BundleToolRunnable; 2 GB completes it.
          ./gradlew bundleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2048m -Xms256m"

      - name: Verify signature
        run: |
          APK=$(find app/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK=$APK"
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$APK"
          AAB=$(find app/android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "AAB=$AAB"
          # An AAB is a JAR; verify its signature with jarsigner.
          "$JAVA_HOME"/bin/jarsigner -verify "$AAB" | tail -3

      - name: Name artifacts
        run: |
          APK=$(find app/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          AAB=$(find app/android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          mkdir -p out
          cp "$APK" "out/TowerFeasibilityPro-${{ inputs.region }}-release.apk"
          cp "$AAB" "out/TowerFeasibilityPro-${{ inputs.region }}-release.aab"
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: towerfeasibility-release
          path: |
            out/*.apk
            out/*.aab
          retention-days: 90

      - name: Report artifact metadata
        run: |
          {
            echo "## ✅ Release artifacts built and signed"
            echo ""
            echo "| Field | APK | AAB |"
            echo "|-------|-----|-----|"
            APK=$(find out -name '*.apk' | head -1); AAB=$(find out -name '*.aab' | head -1)
            ASIZE=$(stat -c%s "$APK"); BSIZE=$(stat -c%s "$AAB")
            ASHA=$(sha256sum "$APK" | cut -d' ' -f1); BSHA=$(sha256sum "$AAB" | cut -d' ' -f1)
            echo "| **File** | \`$(basename "$APK")\` | \`$(basename "$AAB")\` |"
            echo "| **Size** | $((ASIZE/1024/1024)) MB | $((BSIZE/1024/1024)) MB |"
            echo "| **SHA-256** | \`${ASHA:0:16}…\` | \`${BSHA:0:16}…\` |"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Artifact** | \`towerfeasibility-release\` |"
            echo "| **Retention** | 90 days |"
            echo "| **Region** | ${{ inputs.region }} |"
            echo "| **Commit** | \`${GITHUB_SHA::12}\` |"
            echo "| **Build heap** | -Xmx2048m (required for the ~294 MB pack) |"
            echo ""
            echo "> Artifacts are stored on GitHub. To download locally:"
            echo "> \`bash data-pipeline/scripts/pull_ci_artifact.sh release.yml towerfeasibility-release dist/ci\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact metadata reported to job summary."
